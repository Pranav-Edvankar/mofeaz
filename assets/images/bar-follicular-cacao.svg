<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F7F1EA"/>
      <stop offset="100%" stop-color="#ECE3D5" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="barWrapper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F5338"/>
      <stop offset="50%" stop-color="#A66345"/>
      <stop offset="100%" stop-color="#723A24"/>
    </linearGradient>
    <linearGradient id="chocolateTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2216"/>
      <stop offset="50%" stop-color="#2D1A10"/>
      <stop offset="100%" stop-color="#1F110A"/>
    </linearGradient>
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="16" stdDeviation="14" flood-color="#261A13" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="#FAF7F2"/>
  <circle cx="250" cy="250" r="210" fill="url(#cardGlow)"/>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="420" rx="130" ry="16" fill="#241710" opacity="0.16" filter="blur(8px)"/>

  <!-- Exposed Snack Bar (Half unwrapped, showing rich seed texture & cacao) -->
  <g transform="translate(180, 80) rotate(8 70 170)" filter="url(#shadow3D)">
    <!-- Exposed Food Bar portion -->
    <rect x="15" y="30" width="110" height="130" rx="6" fill="url(#chocolateTexture)"/>
    <!-- Seed inclusions (pumpkin seeds, flax bits, sea salt flakes) -->
    <!-- Pumpkin seeds embedded -->
    <ellipse cx="45" cy="65" rx="10" ry="5.5" fill="#5F694F" transform="rotate(-30 45 65)"/>
    <ellipse cx="85" cy="85" rx="12" ry="6" fill="#6A7758" transform="rotate(25 85 85)"/>
    <ellipse cx="50" cy="115" rx="11" ry="5.5" fill="#545E44" transform="rotate(-15 50 115)"/>
    <ellipse cx="95" cy="50" rx="9" ry="5" fill="#667254" transform="rotate(45 95 50)"/>
    <!-- Golden flax seeds -->
    <ellipse cx="65" cy="50" rx="4" ry="2.2" fill="#AD7046" transform="rotate(15 65 50)"/>
    <ellipse cx="70" cy="95" rx="3.8" ry="2" fill="#BD7F53" transform="rotate(-40 70 95)"/>
    <ellipse cx="32" cy="90" rx="4.2" ry="2.2" fill="#AD7046" transform="rotate(60 32 90)"/>
    <ellipse cx="78" cy="130" rx="4" ry="2" fill="#D29469" transform="rotate(10 78 130)"/>
    <!-- Fleur de sel flakes -->
    <rect x="58" y="75" width="3" height="3" fill="#FFFFFF" opacity="0.8" transform="rotate(45 58 75)"/>
    <rect x="38" y="45" width="2.5" height="2.5" fill="#FFFFFF" opacity="0.75" transform="rotate(20 38 45)"/>
    <rect x="88" y="110" width="3" height="3" fill="#FFFFFF" opacity="0.85" transform="rotate(15 88 110)"/>

    <!-- Matte Terracotta Foil Pouch (Covering bottom half) -->
    <path d="M 10 135 L 130 125 L 135 310 L 5 310 Z" fill="url(#barWrapper)"/>
    <!-- Packaging foil crinkle detail -->
    <path d="M 10 135 Q 70 145 130 125 L 128 140 Q 70 155 12 145 Z" fill="#6E3821" opacity="0.4"/>
    
    <!-- Minimalist Product Label on Pouch -->
    <rect x="22" y="165" width="96" height="120" rx="2" fill="#FAF6F0"/>
    <rect x="25" y="168" width="90" height="114" fill="none" stroke="#E6DED3" stroke-width="0.8"/>
    <text x="70" y="190" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="600" letter-spacing="2" fill="#231C18" text-anchor="middle">MOFEAZ</text>
    <text x="70" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" letter-spacing="1" fill="#8F5338" text-anchor="middle">PHASE 01 // FOLLICULAR</text>
    <text x="70" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" letter-spacing="0.5" fill="#6B5F55" text-anchor="middle">DAYS 1 — 14</text>
    <line x1="35" y1="220" x2="105" y2="220" stroke="#E2D7CC" stroke-width="0.6"/>
    <text x="70" y="233" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#261A13" text-anchor="middle">FOLLICULAR CHOCOLATE</text>
    <text x="70" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" fill="#8C7A6D" text-anchor="middle">COLD-MILLED FLAX + ZINC</text>
    <text x="70" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" fill="#8F5338" text-anchor="middle">ESTROGEN HARMONY</text>
    <text x="70" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" fill="#B0A093" text-anchor="middle">45G • GLUTEN FREE</text>
  </g>

  <!-- Ambient Raw Ingredients Resting on Table -->
  <g>
    <!-- Raw Pumpkin Seed -->
    <ellipse cx="140" cy="400" rx="14" ry="7.5" fill="#616C50" transform="rotate(-20 140 400)"/>
    <ellipse cx="138" cy="400" rx="11" ry="5.5" fill="#717D5E" transform="rotate(-20 140 400)"/>
    <!-- Raw Flax Seeds -->
    <ellipse cx="165" cy="415" rx="5" ry="3" fill="#8F5435" transform="rotate(30 165 415)"/>
    <ellipse cx="360" cy="410" rx="5.5" ry="3.2" fill="#784124" transform="rotate(-15 360 410)"/>
    <!-- Raw Cacao Nib -->
    <path d="M 330 395 C 335 390 345 394 342 402 C 338 408 328 405 330 395 Z" fill="#3D2114"/>
  </g>
</svg>

