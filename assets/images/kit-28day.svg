<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2EDE4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8E0D5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC0"/>
      <stop offset="40%" stop-color="#C5B7A7"/>
      <stop offset="100%" stop-color="#AF9E8B"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE6DD"/>
      <stop offset="100%" stop-color="#D5C9BB"/>
    </linearGradient>
    <linearGradient id="terracottaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A56345"/>
      <stop offset="100%" stop-color="#83462B"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49F63"/>
      <stop offset="100%" stop-color="#A67339"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29E6B"/>
      <stop offset="50%" stop-color="#E9D4AE"/>
      <stop offset="100%" stop-color="#A8824E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#3A2C23" flood-opacity="0.22"/>
    </filter>
    <filter id="barShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#241913" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#F8F5F0"/>
  <circle cx="300" cy="310" r="260" fill="url(#bgGlow)"/>

  <!-- Ground Contact Shadow -->
  <ellipse cx="300" cy="495" rx="210" ry="28" fill="#3B2A1E" opacity="0.14" filter="blur(14px)"/>
  <ellipse cx="300" cy="490" rx="160" ry="16" fill="#241913" opacity="0.22" filter="blur(8px)"/>

  <!-- Main Luxury Box Perspective -->
  <g filter="url(#softShadow)">
    <!-- Box Base -->
    <path d="M 140 230 L 460 230 L 485 450 L 115 450 Z" fill="url(#boxGrad)"/>
    <!-- Box Front Face -->
    <path d="M 115 450 L 485 450 L 475 475 L 125 475 Z" fill="#998775" opacity="0.8"/>
    <!-- Left Face Shading -->
    <path d="M 115 450 L 140 230 L 145 230 L 120 450 Z" fill="#887766" opacity="0.4"/>
    <!-- Box Interior Well (Divided into 2 Compartments: Phase 1 & Phase 2) -->
    <rect x="148" y="238" width="304" height="204" rx="4" fill="#2A211B"/>
    
    <!-- Divider between Phase 1 (Follicular) & Phase 2 (Luteal) -->
    <line x1="300" y1="238" x2="300" y2="442" stroke="#8E7D6F" stroke-width="3" stroke-dasharray="4 2"/>

    <!-- Follicular Compartment (Left: 14 Flax & Pumpkin Bars) -->
    <g filter="url(#barShadow)">
      <!-- Stacked bars illusion -->
      <rect x="160" y="270" width="125" height="155" rx="6" fill="#3D3028" opacity="0.6"/>
      <rect x="162" y="260" width="125" height="155" rx="6" fill="#33271F" opacity="0.7"/>
      <!-- Topmost Follicular Bar -->
      <rect x="165" y="250" width="122" height="165" rx="6" fill="url(#terracottaAccent)"/>
      <!-- Bar Foil Texture & Label -->
      <rect x="175" y="265" width="102" height="135" rx="3" fill="#F8F4EE" opacity="0.95"/>
      <text x="226" y="295" font-family="'Cormorant Garamond', serif" font-size="13" font-weight="600" letter-spacing="2" fill="#231C18" text-anchor="middle">MOFEAZ</text>
      <text x="226" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.5" fill="#84472B" text-anchor="middle">PHASE 01 // FOLLICULAR</text>
      <text x="226" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#6B5F55" text-anchor="middle">DAYS 1 — 14</text>
      <circle cx="226" cy="345" r="12" fill="#F0E8DE"/>
      <!-- Mini Pumpkin/Flax Icon -->
      <path d="M 226 338 C 231 341 232 348 226 352 C 220 348 221 341 226 338 Z" fill="#84472B"/>
      <text x="226" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#33271F" text-anchor="middle">PUMPKIN + FLAX</text>
      <text x="226" y="382" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" fill="#8A7E75" text-anchor="middle">RAW CACAO RHYTHM</text>
    </g>

    <!-- Luteal Compartment (Right: 14 Sesame & Sunflower Bars) -->
    <g filter="url(#barShadow)">
      <!-- Stacked bars illusion -->
      <rect x="313" y="270" width="125" height="155" rx="6" fill="#3D3028" opacity="0.6"/>
      <rect x="311" y="260" width="125" height="155" rx="6" fill="#33271F" opacity="0.7"/>
      <!-- Topmost Luteal Bar -->
      <rect x="309" y="250" width="122" height="165" rx="6" fill="url(#amberAccent)"/>
      <!-- Bar Foil Texture & Label -->
      <rect x="319" y="265" width="102" height="135" rx="3" fill="#F8F4EE" opacity="0.95"/>
      <text x="370" y="295" font-family="'Cormorant Garamond', serif" font-size="13" font-weight="600" letter-spacing="2" fill="#231C18" text-anchor="middle">MOFEAZ</text>
      <text x="370" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.5" fill="#A67339" text-anchor="middle">PHASE 02 // LUTEAL</text>
      <text x="370" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#6B5F55" text-anchor="middle">DAYS 15 — 28</text>
      <circle cx="370" cy="345" r="12" fill="#F0E8DE"/>
      <!-- Mini Sesame/Sunflower Icon -->
      <circle cx="370" cy="345" r="4" fill="#A67339"/>
      <circle cx="370" cy="338" r="1.5" fill="#C29E6B"/>
      <circle cx="376" cy="342" r="1.5" fill="#C29E6B"/>
      <circle cx="374" cy="349" r="1.5" fill="#C29E6B"/>
      <circle cx="366" cy="349" r="1.5" fill="#C29E6B"/>
      <circle cx="364" cy="342" r="1.5" fill="#C29E6B"/>
      <text x="370" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#33271F" text-anchor="middle">SESAME + SUNFLOWER</text>
      <text x="370" y="382" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" fill="#8A7E75" text-anchor="middle">TOASTED CRUNCH</text>
    </g>

    <!-- Luxury Slide Lid leaning against the box with gold foil lettering -->
    <g transform="rotate(-11 110 320)">
      <rect x="40" y="200" width="130" height="230" rx="4" fill="url(#lidGrad)" filter="url(#barShadow)"/>
      <rect x="45" y="205" width="120" height="220" fill="none" stroke="#D7CCC0" stroke-width="1"/>
      <text x="105" y="260" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="400" letter-spacing="4" fill="#231C18" text-anchor="middle">MOFEAZ</text>
      <text x="105" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" letter-spacing="2" fill="#84472B" text-anchor="middle">28-DAY CYCLE RITUAL</text>
      <!-- Gold Foil Embossed Seal -->
      <circle cx="105" cy="320" r="22" fill="url(#goldRibbon)"/>
      <circle cx="105" cy="320" r="19" fill="#EDE6DD"/>
      <text x="105" y="322" font-family="'Cormorant Garamond', serif" font-size="10" font-weight="600" fill="#84472B" text-anchor="middle">A → Z</text>
      <text x="105" y="331" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="1" fill="#6B5F55" text-anchor="middle">BALANCE</text>
      <text x="105" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#75675A" text-anchor="middle">28 RAW FUNCTIONAL BARS</text>
      <text x="105" y="386" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" fill="#99887A" text-anchor="middle">ZERO SUGAR • 100% PLANT SEEDS</text>
    </g>
  </g>

  <!-- Scattered Organic Raw Seeds Around Box (Flax, Pumpkin, Sesame) -->
  <g opacity="0.85">
    <!-- Pumpkin Seeds (Green-amber teardrops) -->
    <path d="M 120 495 C 130 498 135 506 128 510 C 122 514 116 504 120 495 Z" fill="#6B705C"/>
    <path d="M 460 500 C 472 502 476 512 470 515 C 463 518 456 508 460 500 Z" fill="#58604B"/>
    <path d="M 490 480 C 498 482 501 490 496 493 C 490 496 486 488 490 480 Z" fill="#757E65"/>
    <!-- Flax Seeds (Shiny warm bronze oval) -->
    <ellipse cx="145" cy="510" rx="5" ry="3" fill="#8F5435" transform="rotate(25 145 510)"/>
    <ellipse cx="138" cy="518" rx="4.5" ry="2.5" fill="#733D22" transform="rotate(-35 138 518)"/>
    <ellipse cx="440" cy="515" rx="5" ry="3" fill="#8F5435" transform="rotate(15 440 515)"/>
    <!-- Golden Sesame Seeds -->
    <ellipse cx="475" cy="518" rx="2.5" ry="1.6" fill="#D4A373"/>
    <ellipse cx="482" cy="512" rx="2.5" ry="1.6" fill="#E6BA88"/>
    <ellipse cx="155" cy="516" rx="2.5" ry="1.6" fill="#D4A373"/>
    <ellipse cx="160" cy="522" rx="2.5" ry="1.6" fill="#E6BA88"/>
  </g>
</svg>

