<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlowAmber" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#EEE4D4" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="lutealWrapper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C28B4E"/>
      <stop offset="50%" stop-color="#DAA56A"/>
      <stop offset="100%" stop-color="#A67035"/>
    </linearGradient>
    <linearGradient id="sesameSeedTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2618"/>
      <stop offset="50%" stop-color="#2D1C12"/>
      <stop offset="100%" stop-color="#21130B"/>
    </linearGradient>
    <filter id="shadowLuteal" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="16" stdDeviation="14" flood-color="#2E1C12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="#FAF7F2"/>
  <circle cx="250" cy="250" r="210" fill="url(#cardGlowAmber)"/>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="420" rx="130" ry="16" fill="#2E1C12" opacity="0.16" filter="blur(8px)"/>

  <!-- Exposed Snack Bar -->
  <g transform="translate(180, 80) rotate(-6 70 170)" filter="url(#shadowLuteal)">
    <!-- Exposed Food Bar portion -->
    <rect x="15" y="30" width="110" height="130" rx="6" fill="url(#sesameSeedTexture)"/>
    <!-- Sesame and Sunflower seed inclusions -->
    <!-- Golden Sesame Seeds clustered -->
    <ellipse cx="40" cy="60" rx="3.5" ry="2" fill="#E8C79E" transform="rotate(-30 40 60)"/>
    <ellipse cx="48" cy="65" rx="3.5" ry="2" fill="#D4AF83" transform="rotate(20 48 65)"/>
    <ellipse cx="56" cy="55" rx="3.5" ry="2" fill="#E8C79E" transform="rotate(-10 56 55)"/>
    <ellipse cx="80" cy="70" rx="3.5" ry="2" fill="#F0D4B2" transform="rotate(45 80 70)"/>
    <ellipse cx="88" cy="78" rx="3.5" ry="2" fill="#D4AF83" transform="rotate(15 88 78)"/>
    <!-- Black Sesame Seeds -->
    <ellipse cx="65" cy="85" rx="3" ry="1.8" fill="#1C140F" transform="rotate(40 65 85)"/>
    <ellipse cx="38" cy="95" rx="3.2" ry="1.9" fill="#1C140F" transform="rotate(-25 38 95)"/>
    <ellipse cx="95" cy="95" rx="3" ry="1.8" fill="#1C140F" transform="rotate(30 95 95)"/>
    <!-- Sunflower Seeds (elongated teardrops) -->
    <path d="M 60 110 C 66 112 70 120 64 125 C 58 123 56 114 60 110 Z" fill="#6B5B4E"/>
    <path d="M 85 45 C 91 48 94 56 88 60 C 82 58 81 50 85 45 Z" fill="#7A6859"/>
    <!-- Salt Crystals -->
    <rect x="52" y="72" width="3" height="3" fill="#FFFFFF" opacity="0.85" transform="rotate(35 52 72)"/>
    <rect x="75" y="115" width="2.5" height="2.5" fill="#FFFFFF" opacity="0.8" transform="rotate(15 75 115)"/>

    <!-- Matte Amber Pouch Wrap -->
    <path d="M 10 135 L 130 125 L 135 310 L 5 310 Z" fill="url(#lutealWrapper)"/>
    <path d="M 10 135 Q 70 145 130 125 L 128 140 Q 70 155 12 145 Z" fill="#75481B" opacity="0.35"/>
    
    <!-- Minimalist Product Label on Pouch -->
    <rect x="22" y="165" width="96" height="120" rx="2" fill="#FAF6F0"/>
    <rect x="25" y="168" width="90" height="114" fill="none" stroke="#E6DED3" stroke-width="0.8"/>
    <text x="70" y="190" font-family="'Cormorant Garamond', serif" font-size="12" font-weight="600" letter-spacing="2" fill="#231C18" text-anchor="middle">MOFEAZ</text>
    <text x="70" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" letter-spacing="1" fill="#C28B4E" text-anchor="middle">PHASE 02 // LUTEAL</text>
    <text x="70" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" letter-spacing="0.5" fill="#6B5F55" text-anchor="middle">DAYS 15 — 28</text>
    <line x1="35" y1="220" x2="105" y2="220" stroke="#E2D7CC" stroke-width="0.6"/>
    <text x="70" y="233" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#261A13" text-anchor="middle">LUTEAL CHOCOLATE</text>
    <text x="70" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" fill="#8C7A6D" text-anchor="middle">SUNFLOWER SEED + SELENIUM</text>
    <text x="70" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="600" fill="#C28B4E" text-anchor="middle">PROGESTERONE CALM</text>
    <text x="70" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" fill="#B0A093" text-anchor="middle">45G • ZERO REFINED SUGAR</text>
  </g>

  <!-- Ambient Raw Ingredients Resting on Table -->
  <g>
    <!-- Sesame cluster -->
    <ellipse cx="140" cy="405" rx="3.5" ry="2" fill="#D4AF83" transform="rotate(15 140 405)"/>
    <ellipse cx="147" cy="402" rx="3.5" ry="2" fill="#E8C79E" transform="rotate(-30 147 402)"/>
    <ellipse cx="152" cy="408" rx="3.2" ry="1.8" fill="#2D1C12" transform="rotate(40 152 408)"/>
    <!-- Sunflower Seed -->
    <path d="M 350 400 C 358 402 364 410 357 415 C 350 414 346 405 350 400 Z" fill="#6B5B4E"/>
    <path d="M 368 408 C 374 410 378 416 373 420 C 367 419 364 412 368 408 Z" fill="#7A6859"/>
  </g>
</svg>

