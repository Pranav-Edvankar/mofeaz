        <path d="M -60 55 C -65 45 -60 30 -50 22 C -42 30 -45 45 -60 55 Z"/>
        <path d="M -75 -15 C -80 -25 -75 -40 -65 -45 C -57 -37 -60 -22 -75 -15 Z"/>
