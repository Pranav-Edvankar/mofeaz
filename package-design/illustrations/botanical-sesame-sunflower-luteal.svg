        <path d="M 0 -18 C -5 -35 5 -35 0 -18" fill="#C26D4D" stroke="#FBF7F0" stroke-width="1.2"/>
        <path d="M 12 -12 C 22 -26 28 -18 12 -12" fill="#C26D4D" stroke="#FBF7F0" stroke-width="1.2"/>
        <path d="M 18 0 C 35 -5 35 5 18 0" fill="#C26D4D" stroke="#FBF7F0" stroke-width="1.2"/>
        <path d="M 12 12 C 28 18 22 26 12 12" fill="#C26D4D" stroke="#FBF7F0" stroke-width="1.2"/>
        <path d="M 0 18 C 5 35 -5 35 0 18" fill="#C26D4D" stroke="#FBF7F0" stroke-width="1.2"/>
