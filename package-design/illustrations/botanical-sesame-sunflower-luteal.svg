        <line x1="0" y1="0" x2="-12" y2="-42" stroke="#FBF7F0" stroke-width="1"/>
      </g>
    </g>

    <!-- Right: Helianthus annuus -->
    <g id="sunflower-stem" stroke-width="1.8">
