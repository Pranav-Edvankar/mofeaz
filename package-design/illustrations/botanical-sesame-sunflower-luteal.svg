      <path d="M 195 440 Q 130 420 140 370 Q 180 395 198 430" fill="#5E3020" stroke="#E29D80" opacity="0.85"/>
      <path d="M 190 350 Q 120 320 135 270 Q 175 295 192 340" fill="#5E3020" stroke="#E29D80" opacity="0.85"/>
      <path d="M 210 260 Q 145 220 165 175 Q 198 205 212 250" fill="#5E3020" stroke="#E29D80" opacity="0.85"/>

