        <path d="M -23 -50 Q -35 5 -18 50" stroke="#FBF7F0" stroke-width="1.2" opacity="0.8"/>
        <path d="M -32 -25 Q -42 10 -28 35" stroke="#FBF7F0" stroke-width="0.8" opacity="0.6"/>

        <path d="M 25 -55 C -5 -20 0 40 35 70 C 65 35 60 -20 25 -55 Z" fill="#4A2619"/>
        <path d="M 25 -40 Q 20 15 32 55" stroke="#FBF7F0" stroke-width="1.2" opacity="0.8"/>
        <path d="M 35 -20 Q 42 10 40 40" stroke="#FBF7F0" stroke-width="0.8" opacity="0.6"/>

        <path d="M 0 -20 C -30 15 -25 70 5 95 C 35 65 30 15 0 -20 Z" fill="#2E160D"/>
        <path d="M 0 -5 Q 0 40 4 80" stroke="#FBF7F0" stroke-width="1.4" opacity="0.9"/>
        <path d="M -12 15 Q -12 45 -5 65" stroke="#FBF7F0" stroke-width="0.8" opacity="0.7"/>
        <path d="M 12 15 Q 12 45 10 65" stroke="#FBF7F0" stroke-width="0.8" opacity="0.7"/>
