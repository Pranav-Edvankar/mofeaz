      <path d="M 405 440 C 475 420 500 470 465 490 C 430 500 408 460 405 440 Z" fill="#5E3020" stroke="#E29D80" opacity="0.85"/>
      <path d="M 408 340 C 485 305 515 355 475 385 C 435 405 412 365 408 340 Z" fill="#5E3020" stroke="#E29D80" opacity="0.85"/>

