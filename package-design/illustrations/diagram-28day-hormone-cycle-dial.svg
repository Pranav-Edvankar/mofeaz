<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%">
  <defs>
    <linearGradient id="goldDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="50%" stop-color="#C99454"/>
      <stop offset="100%" stop-color="#9C6B2F"/>
    </linearGradient>
    <linearGradient id="follicularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3322"/>
      <stop offset="100%" stop-color="#284B34"/>
    </linearGradient>
    <linearGradient id="lutealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E563B"/>
      <stop offset="100%" stop-color="#BD7455"/>
    </linearGradient>
  </defs>

  <g id="cycle-dial" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Background Disc -->
    <circle cx="350" cy="350" r="330" fill="#140E0A" stroke="#C99454" stroke-width="1.5"/>
    <circle cx="350" cy="350" r="322" fill="none" stroke="#C99454" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Left Semi-circle Arc: Phase 01 Follicular (Days 1 to 14) -->
    <path d="M 350 45 A 305 305 0 0 0 350 655 L 350 560 A 210 210 0 0 1 350 140 Z" fill="url(#follicularGrad)" opacity="0.95" stroke="#C99454" stroke-width="1.5"/>

    <!-- Right Semi-circle Arc: Phase 02 Luteal (Days 15 to 28) -->
    <path d="M 350 655 A 305 305 0 0 0 350 45 L 350 140 A 210 210 0 0 1 350 560 Z" fill="url(#lutealGrad)" opacity="0.95" stroke="#C99454" stroke-width="1.5"/>

    <!-- Center Inner Chamber -->
    <circle cx="350" cy="350" r="200" fill="#1C140F" stroke="#C99454" stroke-width="2"/>
    <circle cx="350" cy="350" r="190" fill="none" stroke="#C99454" stroke-width="0.8" opacity="0.4"/>

    <!-- 28 Day Tick Marks along perimeter -->
    <g stroke="#C99454" stroke-width="1.2">
      <!-- 28 radial ticks around circle -->
      <line x1="350" y1="30" x2="350" y2="45"/>
      <line x1="422" y1="39" x2="418" y2="53"/>
      <line x1="490" y1="65" x2="483" y2="78"/>
      <line x1="550" y1="108" x2="540" y2="119"/>
      <line x1="599" y1="165" x2="586" y2="173"/>
      <line x1="632" y1="233" x2="617" y2="238"/>
      <line x1="647" y1="309" x2="632" y2="310"/>
      <line x1="643" y1="387" x2="628" y2="385"/>
      <line x1="620" y1="462" x2="606" y2="456"/>
      <line x1="579" y1="530" x2="567" y2="520"/>
      <line x1="522" y1="585" x2="513" y2="572"/>
      <line x1="454" y1="623" x2="448" y2="609"/>
      <line x1="379" y1="642" x2="377" y2="627"/>
      <line x1="350" y1="645" x2="350" y2="655" stroke-width="2"/>
      <line x1="321" y1="642" x2="323" y2="627"/>
      <line x1="246" y1="623" x2="252" y2="609"/>
      <line x1="178" y1="585" x2="187" y2="572"/>
      <line x1="121" y1="530" x2="133" y2="520"/>
      <line x1="80" y1="462" x2="94" y2="456"/>
      <line x1="57" y1="387" x2="72" y2="385"/>
      <line x1="53" y1="309" x2="68" y2="310"/>
      <line x1="68" y1="233" x2="83" y2="238"/>
      <line x1="101" y1="165" x2="114" y2="173"/>
      <line x1="150" y1="108" x2="160" y2="119"/>
      <line x1="210" y1="65" x2="217" y2="78"/>
      <line x1="278" y1="39" x2="282" y2="53"/>
    </g>

    <!-- Moon Phase Icons Around Perimeter -->
    <!-- New Moon (Top: Day 1 Menstruation / Follicular Start) -->
    <circle cx="350" cy="90" r="16" fill="#140E0A" stroke="#C99454" stroke-width="1.8"/>
    <text x="350" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" fill="#E5C378" font-weight="700" letter-spacing="2">DAY 01</text>
    <text x="350" y="137" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8" fill="#F5EFE6" letter-spacing="1">NEW MOON</text>

    <!-- First Quarter Moon (Left: Day 7 Follicular Surge) -->
    <g transform="translate(140, 350)">
      <circle cx="0" cy="0" r="16" fill="#140E0A" stroke="#C99454" stroke-width="1.8"/>
      <path d="M 0 -16 A 16 16 0 0 1 0 16 Z" fill="#C99454"/>
      <text x="0" y="32" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" fill="#E5C378" font-weight="700" letter-spacing="2">DAY 07</text>
      <text x="0" y="44" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8" fill="#F5EFE6" letter-spacing="1">WAXING</text>
    </g>

    <!-- Full Moon (Bottom: Day 14 Ovulation / Peak Estrogen Transition) -->
    <circle cx="350" cy="610" r="16" fill="#E5C378" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="350" y="575" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" fill="#E5C378" font-weight="700" letter-spacing="2">DAY 14 // OVULATION</text>
    <text x="350" y="587" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8" fill="#F5EFE6" letter-spacing="1">FULL MOON</text>

    <!-- Third Quarter Moon (Right: Day 21 Luteal Progesterone Peak) -->
    <g transform="translate(560, 350)">
      <circle cx="0" cy="0" r="16" fill="#140E0A" stroke="#C99454" stroke-width="1.8"/>
      <path d="M 0 -16 A 16 16 0 0 0 0 16 Z" fill="#C99454"/>
      <text x="0" y="32" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" fill="#E5C378" font-weight="700" letter-spacing="2">DAY 21</text>
      <text x="0" y="44" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8" fill="#F5EFE6" letter-spacing="1">WANING</text>
    </g>

    <!-- Inside Left Zone Copy (Follicular) -->
    <g transform="translate(265, 300)" text-anchor="middle">
      <text y="0" font-family="'Montserrat', sans-serif" font-size="11" fill="#E5C378" font-weight="700" letter-spacing="3">PHASE 01</text>
      <text y="20" font-family="'Bodoni Moda', serif" font-size="18" fill="#FFFFFF" font-style="italic">Follicular</text>
      <text y="38" font-family="'Montserrat', sans-serif" font-size="9" fill="#A8D5B5" letter-spacing="1">DAYS 1 - 14</text>
      <text y="58" font-family="'Montserrat', sans-serif" font-size="8" fill="#F5EFE6" letter-spacing="1">PUMPKIN + FLAX</text>
      <text y="72" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#E5C378" letter-spacing="1">ESTROGEN HARMONY</text>
    </g>

    <!-- Inside Right Zone Copy (Luteal) -->
    <g transform="translate(435, 300)" text-anchor="middle">
      <text y="0" font-family="'Montserrat', sans-serif" font-size="11" fill="#E5C378" font-weight="700" letter-spacing="3">PHASE 02</text>
      <text y="20" font-family="'Bodoni Moda', serif" font-size="18" fill="#FFFFFF" font-style="italic">Luteal</text>
      <text y="38" font-family="'Montserrat', sans-serif" font-size="9" fill="#E5A88E" letter-spacing="1">DAYS 15 - 28</text>
      <text y="58" font-family="'Montserrat', sans-serif" font-size="8" fill="#F5EFE6" letter-spacing="1">SESAME + SUNFLOWER</text>
      <text y="72" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#E5C378" letter-spacing="1">PROGESTERONE SUPPORT</text>
    </g>

    <!-- Center Luxury Monogram -->
    <g transform="translate(350, 350)">
      <circle cx="0" cy="0" r="48" fill="#140E0A" stroke="#C99454" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#C99454" stroke-width="0.8" stroke-dasharray="2 2"/>
      <text y="-8" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="18" fill="#FFFFFF" letter-spacing="2">MOFEAZ</text>
      <text y="10" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6.5" fill="#C99454" letter-spacing="3">28-DAY RITUAL</text>
      <text y="22" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="5.5" fill="#C99454" letter-spacing="2">moi • fea • z</text>
    </g>
  </g>
</svg>