<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C99454"/>
      <stop offset="100%" stop-color="#9C6B2F"/>
    </linearGradient>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4D36"/>
      <stop offset="100%" stop-color="#182B1E"/>
    </linearGradient>
  </defs>

  <g id="follicular-botanicals" stroke="url(#goldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Decorative Botanical Laurel Ring -->
    <circle cx="300" cy="300" r="275" stroke="#C99454" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4"/>
    <circle cx="300" cy="300" r="285" stroke="#C99454" stroke-width="0.8" opacity="0.25"/>

    <!-- Left Branch: Linum usitatissimum (Flaxseed Plant) -->
    <g id="flax-stem" stroke-width="1.8">
      <path d="M 220 500 Q 180 380 210 260 T 260 120" stroke="#C99454" stroke-width="2.2"/>
      
      <!-- Flax Leaves -->
      <path d="M 200 440 Q 150 420 160 380 Q 190 400 202 430" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      <path d="M 195 360 Q 130 330 145 290 Q 180 310 198 350" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      <path d="M 215 280 Q 160 230 180 190 Q 210 220 220 270" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      <path d="M 235 200 Q 200 150 220 120 Q 240 150 240 190" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      
      <!-- Flax Delicate 5-Petal Blossoms -->
      <g transform="translate(260, 120)">
        <circle cx="0" cy="0" r="4" fill="#E5C378"/>
        <path d="M 0 -4 C -8 -22 8 -22 0 -4" fill="#314F3A" stroke="#E5C378" stroke-width="1.2"/>
        <path d="M 3.8 -1.2 C 18 -15 26 0 3.8 -1.2" fill="#314F3A" stroke="#E5C378" stroke-width="1.2"/>
        <path d="M 2.4 3.2 C 14 18 2 26 2.4 3.2" fill="#314F3A" stroke="#E5C378" stroke-width="1.2"/>
        <path d="M -2.4 3.2 C -14 18 -2 26 -2.4 3.2" fill="#314F3A" stroke="#E5C378" stroke-width="1.2"/>
        <path d="M -3.8 -1.2 C -18 -15 -26 0 -3.8 -1.2" fill="#314F3A" stroke="#E5C378" stroke-width="1.2"/>
      </g>
      
      <!-- Flax Seed Pods -->
      <g transform="translate(230, 230)">
        <path d="M 0 0 C 15 -5 20 -25 5 -30 C -10 -25 -5 -5 0 0 Z" fill="#243D2B" stroke="#E5C378" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="5" y2="-30" stroke="#C99454" stroke-width="1"/>
      </g>
      <g transform="translate(195, 330)">
        <path d="M 0 0 C -15 -5 -20 -25 -5 -30 C 10 -25 5 -5 0 0 Z" fill="#243D2B" stroke="#E5C378" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="-5" y2="-30" stroke="#C99454" stroke-width="1"/>
      </g>
    </g>

    <!-- Right Branch: Cucurbita pepo (Pumpkin Seed Vine) -->
    <g id="pumpkin-vine" stroke-width="1.8">
      <path d="M 380 500 Q 420 370 390 250 T 340 110" stroke="#C99454" stroke-width="2.2"/>
      <path d="M 390 250 Q 450 240 460 210 Q 470 180 440 180 Q 420 180 430 200" stroke="#E5C378" stroke-width="1.4"/>
      
      <!-- Pumpkin Broad Lobed Leaves -->
      <path d="M 400 430 C 470 410 490 460 460 480 C 430 490 405 450 400 430 Z" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      <path d="M 405 340 C 480 300 510 350 470 380 C 430 400 410 360 405 340 Z" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      <path d="M 380 210 C 450 160 460 220 430 240 C 400 250 385 220 380 210 Z" fill="#243D2B" stroke="#C99454" opacity="0.85"/>
      
      <!-- Golden Star Flower -->
      <g transform="translate(340, 110)">
        <circle cx="0" cy="0" r="5" fill="#E5C378"/>
        <polygon points="0,-25 7,-7 24,-7 11,4 16,21 0,11 -16,21 -11,4 -24,-7 -7,-7" fill="#2B4632" stroke="#E5C378" stroke-width="1.4"/>
      </g>
    </g>

    <!-- Center Composition: Golden Flaxseeds & Plump Pepitas -->
    <g id="seed-cluster" transform="translate(300, 320)">
      <!-- Golden Flaxseeds -->
      <g stroke="#E5C378" stroke-width="1.4">
        <path d="M -70 40 C -85 20 -80 -10 -60 -25 C -45 -10 -50 20 -70 40 Z" fill="#C99454"/>
        <path d="M -62 -18 Q -60 10 -68 30" stroke="#E5C378" stroke-width="1" opacity="0.7"/>
        <path d="M -40 70 C -55 50 -50 20 -30 5 C -15 20 -20 50 -40 70 Z" fill="#B8803B"/>
        <path d="M 60 50 C 45 30 50 0 70 -15 C 85 0 80 30 60 50 Z" fill="#C99454"/>
        <path d="M 40 80 C 25 60 30 30 50 15 C 65 30 60 60 40 80 Z" fill="#B8803B"/>
      </g>

      <!-- Plump Organic Pumpkin Seeds -->
      <g stroke="#E5C378" stroke-width="1.8">
        <path d="M -20 -60 C -55 -30 -60 30 -25 65 C 10 35 15 -25 -20 -60 Z" fill="#203825"/>
        <path d="M -20 -45 Q -25 0 -22 45" stroke="#E5C378" stroke-width="1.2" opacity="0.6"/>
        <path d="M 20 -50 C -15 -20 -10 40 25 70 C 60 35 55 -25 20 -50 Z" fill="#27442D"/>
        <path d="M 20 -35 Q 25 10 22 55" stroke="#E5C378" stroke-width="1.2" opacity="0.6"/>
        <path d="M 0 -15 C -30 15 -30 65 0 95 C 30 65 30 15 0 -15 Z" fill="#1C3020"/>
        <path d="M 0 0 Q 0 40 0 80" stroke="#E5C378" stroke-width="1.2" opacity="0.7"/>
      </g>
    </g>

    <text x="300" y="540" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" letter-spacing="6" fill="#E5C378" stroke="none" font-weight="600">
      PHASE 01 // CUCURBITA PEPO &amp; LINUM USITATISSIMUM
    </text>
    <text x="300" y="560" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="16" letter-spacing="3" fill="#FFFFFF" stroke="none" font-style="italic">
      Organic Pumpkin &amp; Golden Flaxseed
    </text>
  </g>
</svg>