<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="seedPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#1C140F"/>
      <!-- Pepita motif -->
      <path d="M 20 20 C 10 30 10 45 20 55 C 30 45 30 30 20 20 Z" fill="none" stroke="#C99454" stroke-width="0.8" opacity="0.35"/>
      <!-- Flaxseed motif -->
      <path d="M 70 30 C 65 35 65 42 70 47 C 75 42 75 35 70 30 Z" fill="#C99454" opacity="0.25"/>
      <!-- Sesame motif -->
      <path d="M 35 80 C 32 83 32 88 35 91 C 38 88 38 83 35 80 Z" fill="#C99454" opacity="0.25"/>
      <!-- Sunflower seed striped motif -->
      <path d="M 75 75 C 65 82 68 95 80 98 C 88 88 85 78 75 75 Z" fill="none" stroke="#C99454" stroke-width="0.8" opacity="0.35"/>
      <!-- Connecting delicate geometric grid dot -->
      <circle cx="50" cy="50" r="1" fill="#C99454" opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#C99454" opacity="0.4"/>
      <circle cx="100" cy="100" r="1" fill="#C99454" opacity="0.4"/>
      <line x1="50" y1="46" x2="50" y2="54" stroke="#C99454" stroke-width="0.5" opacity="0.3"/>
      <line x1="46" y1="50" x2="54" y2="50" stroke="#C99454" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#seedPattern)"/>
</svg>