    <g transform="translate(16, 96)">
      <rect width="188" height="152" fill="#142619" stroke="#C99454" stroke-width="0.8"/>
      <text class="font-sans" font-size="9" font-weight="800" fill="#FFFFFF" x="8" y="16">NUTRITION FACTS</text>
      <text class="font-sans" font-size="6" fill="#C99454" x="8" y="27">Serving Size: 1 Bar (50g) | Servings Per Pack: 1</text>
      <line x1="8" y1="32" x2="180" y2="32" stroke="#FFFFFF" stroke-width="1.5"/>
      <text class="font-sans" font-size="7" font-weight="700" fill="#FFFFFF" x="8" y="44">Calories 242 kcal</text>
      <line x1="8" y1="48" x2="180" y2="48" stroke="#C99454" stroke-width="0.5"/>
      <!-- Rows -->
      <text class="font-sans" font-size="6" fill="#F5EFE6" x="8" y="59">Total Fat 16.5g (21% DV)</text>
      <text class="font-sans" font-size="6" fill="#F5EFE6" x="8" y="70">  Saturated Fat 4.2g (21% DV)</text>
      <text class="font-sans" font-size="6" fill="#F5EFE6" x="8" y="81">  Omega-3 Fatty Acids (ALA) 1,850mg</text>
      <text class="font-sans" font-size="6" fill="#F5EFE6" x="8" y="92">Total Carbohydrates 18g (6% DV)</text>
      <text class="font-sans" font-size="6" fill="#F5EFE6" x="8" y="103">  Dietary Fiber 7.2g (26% DV)</text>
      <text class="font-sans" font-size="6" fill="#F5EFE6" x="8" y="114">  Total Sugars 7.8g (From Whole Dates)</text>
      <text class="font-sans" font-size="6" fill="#A8D5B5" x="8" y="125">  Added Sugars 0.0g (0% DV)</text>
      <text class="font-sans" font-size="6.5" font-weight="700" fill="#FFFFFF" x="8" y="137">Protein 8.4g (17% DV) | Zinc 3.2mg (29% DV)</text>
      <text class="font-sans" font-size="5.5" fill="#E5C378" x="8" y="146">Magnesium 112mg (28% DV)</text>
    </g>

    <!-- Ingredients List -->
    <g transform="translate(16, 260)">
      <text class="font-sans" font-size="6.5" font-weight="700" fill="#E5C378" letter-spacing="1">INGREDIENTS:</text>
      <text class="font-sans" font-size="5.8" fill="#F5EFE6" y="11">
        Sprouted Organic Pumpkin Seeds (36%), Cold-Milled
      </text>
      <text class="font-sans" font-size="5.8" fill="#F5EFE6" y="21">
        Golden Flaxseed (24%), Raw Single-Origin Cacao Paste (70%),
      </text>
      <text class="font-sans" font-size="5.8" fill="#F5EFE6" y="31">
        Medjool Date Puree, Pink Himalayan Salt, Madagascar Vanilla.
      </text>
      <text class="font-sans" font-size="5.5" fill="#C99454" y="42" font-style="italic">
        ALLERGEN ADVICE: Processed in a dedicated gluten-free &amp; peanut-free facility.
      </text>
    </g>

    <!-- Clinical Seal & Regulatory (FSSAI + Barcode) -->
    <g transform="translate(16, 330)">
      <!-- Clinical Endorsement -->
      <circle cx="25" cy="25" r="22" fill="#142619" stroke="#C99454" stroke-width="0.8"/>
      <text class="font-sans" font-size="4.5" fill="#E5C378" text-anchor="middle" x="25" y="18">DR. SWETTA</text>
      <text class="font-sans" font-size="4.5" fill="#E5C378" text-anchor="middle" x="25" y="26">SHARMA PhD</text>
      <text class="font-sans" font-size="3.8" fill="#F5EFE6" text-anchor="middle" x="25" y="34">FORMULATED</text>

      <!-- FSSAI License Number Box -->
      <g transform="translate(60, 5)">
        <text class="font-sans" font-size="7" font-weight="700" fill="#FFFFFF">fssai</text>
        <text class="font-sans" font-size="5.2" fill="#C99454" y="12">Lic. No. 11523998000412</text>
        <text class="font-sans" font-size="5" fill="#888" y="22">Country of Origin: India</text>
        <text class="font-sans" font-size="5" fill="#888" y="32">Mfd By: Mofeaz Functional Foods LLP</text>
      </g>
    </g>

    <!-- Standard Barcode Box -->
    <g transform="translate(16, 390)">
      <rect width="188" height="42" fill="#FFFFFF" rx="2"/>
      <!-- Simulated EAN-13 Barcode Lines -->
      <g stroke="#000000" stroke-width="1.6" transform="translate(15, 6)">
        <line x1="0" y1="0" x2="0" y2="22"/>
        <line x1="3" y1="0" x2="3" y2="22"/>
        <line x1="8" y1="0" x2="8" y2="22"/>
        <line x1="12" y1="0" x2="12" y2="22"/>
        <line x1="18" y1="0" x2="18" y2="22"/>
        <line x1="22" y1="0" x2="22" y2="22"/>
        <line x1="28" y1="0" x2="28" y2="22"/>
        <line x1="35" y1="0" x2="35" y2="22"/>
        <line x1="42" y1="0" x2="42" y2="22"/>
        <line x1="48" y1="0" x2="48" y2="22"/>
        <line x1="55" y1="0" x2="55" y2="22"/>
        <line x1="62" y1="0" x2="62" y2="22"/>
        <line x1="70" y1="0" x2="70" y2="22"/>
        <line x1="78" y1="0" x2="78" y2="22"/>
        <line x1="85" y1="0" x2="85" y2="22"/>
        <line x1="92" y1="0" x2="92" y2="22"/>
        <line x1="100" y1="0" x2="100" y2="22"/>
        <line x1="108" y1="0" x2="108" y2="22"/>
        <line x1="115" y1="0" x2="115" y2="22"/>
        <line x1="122" y1="0" x2="122" y2="22"/>
        <line x1="130" y1="0" x2="130" y2="22"/>
        <line x1="138" y1="0" x2="138" y2="22"/>
        <line x1="145" y1="0" x2="145" y2="22"/>
        <line x1="152" y1="0" x2="152" y2="22"/>
      </g>
      <text class="font-sans" font-size="6" fill="#000000" x="94" y="36" text-anchor="middle" letter-spacing="2">
        8 908021 543019
      </text>
    </g>
  </g>

  <!-- ARTWORK LAYER: Side Spines -->
  <!-- Left Spine (x=380, w=50, y=220, h=460) -->
  <g id="left-spine-artwork" transform="translate(380, 220)">
    <!-- Rotated Spine Branding -->
    <g transform="translate(25, 230) rotate(-90)">
      <text class="font-header" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MOFEAZ</text>
      <text class="font-sans" font-size="6" fill="#C99454" text-anchor="middle" y="14" letter-spacing="2">PHASE 01 // FOLLICULAR RITUAL</text>
    </g>
  </g>

  <!-- Right Spine (x=650, w=50, y=220, h=460) -->
  <g id="right-spine-artwork" transform="translate(650, 220)">
    <g transform="translate(25, 230) rotate(90)">
      <text class="font-sans" font-size="6" fill="#E5C378" text-anchor="middle" letter-spacing="2.5">
        ESTROGEN HARMONY &bull; 100% WHOLE SEEDS &bull; NET WT. 50g
      </text>
    </g>
  </g>

  <!-- ARTWORK LAYER: Top & Bottom Tuck Flaps -->
  <g id="top-flap-artwork" transform="translate(430, 140)">
    <text class="font-sans" font-size="7" fill="#C99454" text-anchor="middle" x="110" y="50" letter-spacing="2">
      MOI • FEA • Z // ME FEAST FROM A TO Z
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- TECHNICAL DIELINE LINES (CUT, CREASE, BLEED) OVERLAY         -->
  <!-- ============================================================ -->
  <g id="technical-dieline">
    <!-- Bleed Margin Boundary (3mm outside cut line) -->
    <rect x="112" y="132" width="606" height="636" class="bleed-line"/>

    <!-- Cut Lines (Outer perimeter of folded carton) -->
    <!-- Glue Tab (Left) -->
    <path d="M 160 220 L 120 235 L 120 665 L 160 680" class="cut-line"/>
    <!-- Top Flaps Cut Line -->
    <path d="M 160 220 L 380 220" class="cut-line"/>
    <path d="M 380 220 L 386 175 Q 405 170 424 175 L 430 220" class="cut-line"/>
    <path d="M 430 220 L 440 146 Q 540 138 640 146 L 650 220" class="cut-line"/>
    <path d="M 650 220 L 656 175 Q 675 170 694 175 L 700 220" class="cut-line"/>
    <!-- Right Outer Edge Cut Line -->
    <path d="M 700 220 L 700 680" class="cut-line"/>
    <!-- Bottom Flaps Cut Line -->
    <path d="M 700 680 L 694 725 Q 675 730 656 725 L 650 680" class="cut-line"/>
    <path d="M 650 680 L 430 680" class="cut-line"/>
    <path d="M 430 680 L 424 725 Q 405 730 386 725 L 380 680" class="cut-line"/>
    <path d="M 380 680 L 370 754 Q 270 762 170 754 L 160 680" class="cut-line"/>

    <!-- Crease / Score Lines (Internal Folds) -->
    <!-- Vertical Fold Lines between panels -->
    <line x1="160" y1="220" x2="160" y2="680" class="crease-line"/>
    <line x1="380" y1="220" x2="380" y2="680" class="crease-line"/>
    <line x1="430" y1="220" x2="430" y2="680" class="crease-line"/>
    <line x1="650" y1="220" x2="650" y2="680" class="crease-line"/>
    <!-- Horizontal Fold Lines for Top and Bottom Flaps -->
    <line x1="160" y1="220" x2="700" y2="220" class="crease-line"/>
    <line x1="160" y1="680" x2="700" y2="680" class="crease-line"/>
    <!-- Tuck Flap Score -->
    <line x1="440" y1="165" x2="640" y2="165" class="crease-line"/>
    <line x1="170" y1="735" x2="370" y2="735" class="crease-line"/>
  </g>

  <!-- Dimension Callout Annotations -->
  <g class="guide-text" font-size="9">
    <!-- Width Dimension Callout -->
    <line x1="430" y1="785" x2="650" y2="785" stroke="#999" stroke-width="1"/>
    <line x1="430" y1="780" x2="430" y2="790" stroke="#999" stroke-width="1"/>
    <line x1="650" y1="780" x2="650" y2="790" stroke="#999" stroke-width="1"/>
    <text x="540" y="800" text-anchor="middle" fill="#555">Front Width: 75.0 mm</text>

    <!-- Spine Dimension Callout -->
    <line x1="650" y1="785" x2="700" y2="785" stroke="#999" stroke-width="1"/>
    <line x1="700" y1="780" x2="700" y2="790" stroke="#999" stroke-width="1"/>
    <text x="675" y="800" text-anchor="middle" fill="#555">14 mm</text>

    <!-- Height Dimension Callout -->
    <line x1="735" y1="220" x2="735" y2="680" stroke="#999" stroke-width="1"/>
    <line x1="730" y1="220" x2="740" y2="220" stroke="#999" stroke-width="1"/>
    <line x1="730" y1="680" x2="740" y2="680" stroke="#999" stroke-width="1"/>
    <text x="750" y="455" fill="#555" transform="rotate(90, 750, 455)" text-anchor="middle">Body Height: 150.0 mm</text>
  </g>
</svg>