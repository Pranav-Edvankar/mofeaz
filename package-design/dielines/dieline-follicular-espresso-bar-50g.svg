<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <style>
      .font-header { font-family: 'Bodoni Moda', 'Playfair Display', serif; }
      .font-sans { font-family: 'Montserrat', 'Helvetica Neue', sans-serif; }
      .cut-line { stroke: #E6007E; stroke-width: 1.5; fill: none; }
      .crease-line { stroke: #00A0E9; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
      .bleed-line { stroke: #00B050; stroke-width: 0.8; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="950" fill="#FAF8F5"/>

  <g transform="translate(60, 45)">
    <text class="font-header" font-size="20" fill="#2B1A11" font-weight="600">MOFEAZ // LUXURY PACKAGING PRODUCTION DIELINE</text>
    <text class="font-sans" font-size="10.5" fill="#666" y="20" letter-spacing="1">
      PRODUCT: PHASE 01 FOLLICULAR ROASTED ESPRESSO SEED BUTTER BAR (50g) | STRUCTURE: REVERSE TUCK END CARTON
    </text>
    <text class="font-sans" font-size="9.5" fill="#888" y="34" letter-spacing="0.5">
      FINISHED SIZE: 75mm (W) × 150mm (H) × 14mm (D) | BOARD: 350 GSM FSC KRAFT | FINISH: DEEP ESPRESSO MOCHA (PMS 4625C) + BRONZE METALLIC FOIL
    </text>
  </g>

  <!-- Deep Espresso Mocha Background (#21140D) -->
  <g id="artwork-background">
    <rect x="156" y="216" width="548" height="468" fill="#21140D"/>
    <path d="M 426 220 L 440 146 Q 540 138 640 146 L 654 220 Z" fill="#21140D"/>
    <path d="M 156 680 L 170 754 Q 270 762 370 754 L 384 680 Z" fill="#21140D"/>
    <path d="M 380 220 L 386 175 Q 405 170 424 175 L 430 220 Z" fill="#21140D"/>
    <path d="M 650 220 L 656 175 Q 675 170 694 175 L 700 220 Z" fill="#21140D"/>
    <path d="M 380 680 L 386 725 Q 405 730 424 725 L 430 680 Z" fill="#21140D"/>
    <path d="M 650 680 L 656 725 Q 675 730 694 725 L 700 680 Z" fill="#21140D"/>
  </g>

  <!-- Front Panel Graphics -->
  <g id="front-panel-artwork" transform="translate(430, 220)">
    <rect x="10" y="12" width="200" height="436" fill="none" stroke="#BA8752" stroke-width="0.8" opacity="0.6"/>
    <rect x="14" y="16" width="192" height="428" fill="none" stroke="#BA8752" stroke-width="0.4" stroke-dasharray="2 2" opacity="0.4"/>

    <g transform="translate(110, 38)">
      <rect x="-65" y="-10" width="130" height="20" rx="10" fill="#3D2417" stroke="#BA8752" stroke-width="0.8"/>
      <text class="font-sans" font-size="7.5" fill="#E5BE90" font-weight="700" letter-spacing="2" text-anchor="middle" y="3.5">
        PHASE 01 // MORNING RITUAL
      </text>
    </g>

    <text class="font-header" font-size="28" fill="#FFFFFF" text-anchor="middle" x="110" y="85" letter-spacing="3">
      MOFEAZ
    </text>
    <text class="font-sans" font-size="6.5" fill="#BA8752" text-anchor="middle" x="110" y="98" letter-spacing="3.5">
      moi • fea • z
    </text>

    <text class="font-sans" font-size="8.5" fill="#FFFFFF" font-weight="600" text-anchor="middle" x="110" y="125" letter-spacing="2.5">
      FOLLICULAR COFFEE
    </text>
    <text class="font-header" font-size="12" fill="#E5BE90" font-style="italic" text-anchor="middle" x="110" y="142">
      Dark Roast Arabica &amp; Sprouted Seeds
    </text>

    <!-- Coffee & Seed Motif -->
    <g transform="translate(110, 225) scale(0.48)" stroke="#E5BE90" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="110" stroke="#BA8752" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>
      <path d="M 0 -30 C -25 -10 -25 25 0 45 C 25 25 25 -10 0 -30 Z" fill="#381E11" stroke="#E5BE90" stroke-width="1.8"/>
      <path d="M 0 -25 Q -10 5 8 15 T 0 40" stroke="#BA8752" stroke-width="1.8"/>
    </g>

    <text class="font-sans" font-size="7" fill="#F5EFE6" text-anchor="middle" x="110" y="320" letter-spacing="1.5">
      FUNCTIONAL ROASTED ESPRESSO SEED BAR
    </text>
    <text class="font-sans" font-size="6.5" fill="#BA8752" text-anchor="middle" x="110" y="333" letter-spacing="1.2">
      CLEAN MORNING FOCUS &bull; ZERO CRASH &bull; PUMPKIN + FLAX
    </text>

    <g transform="translate(110, 365)">
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#BA8752" stroke-width="0.6" opacity="0.5"/>
      <text class="font-sans" font-size="6.5" fill="#E5BE90" font-weight="600" text-anchor="middle" y="-6" letter-spacing="2">
        SUSTAINED METABOLIC ENERGY // L-THEANINE &amp; ZINC
      </text>
      <text class="font-sans" font-size="6" fill="#F5EFE6" text-anchor="middle" y="10" letter-spacing="1">
        COLD-MILLED &bull; ZERO ADDED SUGAR &bull; DAYS 1 - 14
      </text>
    </g>

    <g transform="translate(30, 420)">
      <rect x="0" y="-12" width="14" height="14" fill="none" stroke="#00B050" stroke-width="1.2"/>
      <circle cx="7" cy="-5" r="4" fill="#00B050"/>
    </g>
    <text class="font-sans" font-size="8" fill="#FFFFFF" font-weight="700" x="190" y="422" text-anchor="end" letter-spacing="1">
      NET WT. 50g (1.76 OZ)
    </text>
  </g>

  <!-- Technical Dieline Lines -->
  <g id="technical-dieline">
    <rect x="112" y="132" width="606" height="636" class="bleed-line"/>
    <path d="M 160 220 L 120 235 L 120 665 L 160 680" class="cut-line"/>
    <path d="M 160 220 L 380 220" class="cut-line"/>
    <path d="M 380 220 L 386 175 Q 405 170 424 175 L 430 220" class="cut-line"/>
    <path d="M 430 220 L 440 146 Q 540 138 640 146 L 650 220" class="cut-line"/>
    <path d="M 650 220 L 656 175 Q 675 170 694 175 L 700 220" class="cut-line"/>
    <path d="M 700 220 L 700 680" class="cut-line"/>
    <path d="M 700 680 L 694 725 Q 675 730 656 725 L 650 680" class="cut-line"/>
    <path d="M 650 680 L 430 680" class="cut-line"/>
    <path d="M 430 680 L 424 725 Q 405 730 386 725 L 380 680" class="cut-line"/>
    <path d="M 380 680 L 370 754 Q 270 762 170 754 L 160 680" class="cut-line"/>

    <line x1="160" y1="220" x2="160" y2="680" class="crease-line"/>
    <line x1="380" y1="220" x2="380" y2="680" class="crease-line"/>
    <line x1="430" y1="220" x2="430" y2="680" class="crease-line"/>
    <line x1="650" y1="220" x2="650" y2="680" class="crease-line"/>
    <line x1="160" y1="220" x2="700" y2="220" class="crease-line"/>
    <line x1="160" y1="680" x2="700" y2="680" class="crease-line"/>
  </g>
</svg>